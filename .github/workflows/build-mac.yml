name: Build macOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B clean package

      - name: Create macOS DMG with jpackage
        run: |
          echo "===== target 目录内容 ====="
          ls -la target/

          echo "===== 查找 jar 文件 ====="
          JAR_FILE=$(find target -name "*.jar" ! -name "*sources*" ! -name "*javadoc*" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "错误：没有找到任何 jar 文件"
            exit 1
          fi
          echo "找到 jar: $JAR_FILE"

          JAR_NAME=$(basename "$JAR_FILE")
          echo "jar 文件名: $JAR_NAME"

          mkdir -p output
          jpackage \
            --type dmg \
            --name "ScriptWeaver" \
            --input target \
            --main-jar "$JAR_NAME" \
            --main-class org.example.MainFrame \
            --dest output

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ScriptWeaver-macOS
          path: output/*.dmg
